name: Build

# Trigger when a pull request is received
on:
  #pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: [ "3.10" ]
        include:
          - os: ubuntu-latest
    steps:  
    - name: Checkout the code
      uses: actions/checkout@v3
      with:
        # The m68k build includes xpad/src/xpad.inc, and it runs before
        # rp/build.sh (which inits submodules itself), so checkout has to
        # bring xpad in. Top level only, deliberately: that is enough for
        # xpad, which has no submodules of its own, and it leaves the
        # pico-sdk tree to rp/build.sh's recursive init exactly as before.
        submodules: true
  
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install the Pico Toolchain
      run: |
          sudo DEBIAN_FRONTEND=noninteractive apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential libstdc++-arm-none-eabi-newlib
    
    - name: Install AtariST Toolkit Docker image
      run: curl -sL https://github.com/sidecartridge/atarist-toolkit-docker/releases/download/v1.0.0/install_atarist_toolkit_docker.sh | bash

    - name: Run - remove interactive
      run: sed -i 's/-it//' /usr/local/bin/stcmd

    - name: Run - Host tests
      run: make -C rp/test test

    - name: Run - Build PICO_W release version
      env:
        APP_UUID: ${{ secrets.APP_UUID }}
        # Build the version that is committed. The bump-on-build is for
        # local runs; in CI it would name the release one patch past
        # version.txt and the CHANGELOG, and the bump is never committed
        # back, so nothing in git would ever match the published number.
        SKIP_VERSION_BUMP: "1"
      run: ./build.sh pico_w Release ${APP_UUID:-44444444-4444-4444-8444-444444444444}
